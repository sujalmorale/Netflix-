<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch TV Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@300;400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-background">
        <div class="login-overlay"></div>
        <header class="login-header">
            <h1 class="logo">NETFLIX</h1>
            <div class="login-header-right">
                <select class="language-select">
                    <option>English</option>
                    <option>हिन्दी</option>
                </select>
                <a href="index.html" class="btn-signin">Sign In</a>
            </div>
        </header>

        <main class="login-main">
            <h1 class="login-title">Unlimited movies, TV shows, and more</h1>
            <p class="login-subtitle">Starts at ₹149. Cancel anytime.</p>
            <p class="login-prompt">Ready to watch? Enter your email to create or restart your membership.</p>
            
            <form action="index.html" class="login-form">
                <div class="input-group">
                    <input type="email" placeholder="Email address" required>
                </div>
                <button type="submit" class="btn-get-started">Get Started <i class="fas fa-chevron-right"></i></button>
            </form>
        </main>
        
        <div class="curve-container">
            <div class="curve-border"></div>
        </div>
    </div>
</body>
</html>
